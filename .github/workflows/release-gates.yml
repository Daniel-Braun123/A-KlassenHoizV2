name: Release Gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 35
    env:
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
      # Synthetic public key; release checks never use production push credentials.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BCLTyGqMvLIxGohc-UnmoGPChwYQO_nsmW4XE_V5KUVFFv8w3_p56tIOjOUuJXQtD1vXDK1UEfO0GaCZNJTUy0E
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:start
      - name: Export local release-test environment
        shell: pwsh
        run: |
          $status = npx supabase status -o env
          $values = @{}
          foreach ($line in $status) {
            if ($line -match '^(API_URL|PUBLISHABLE_KEY|JWT_SECRET)="([^"]+)"$') {
              $values[$matches[1]] = $matches[2]
            }
          }
          "NEXT_PUBLIC_SUPABASE_URL=$($values.API_URL)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$($values.PUBLISHABLE_KEY)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SUPABASE_TEST_JWT_SECRET=$($values.JWT_SECRET)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NEXT_TELEMETRY_DISABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run build
      - run: npm run test:e2e -- -Project chromium
      - run: npm run test:accessibility -- -Project chromium
      - run: npm run test:pwa -- -Project chromium
      # Measure the intended eight-match fixture, independent of earlier E2E data.
      - run: npm run db:reset
      - run: npm run test:performance:lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-performance-evidence
          path: docs/quality/artifacts/lighthouse-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  remote-mutation-sentinel:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Remote reset, migrations, production identities, test data and cutover are never CI jobs."
