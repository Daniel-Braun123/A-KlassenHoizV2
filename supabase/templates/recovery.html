<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passwort zurücksetzen</title>
  </head>
  <body style="margin: 0; background: #f3f8f5; color: #13261c">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td style="padding: 32px 16px" align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 560px;
              border: 1px solid #c9dacf;
              border-radius: 20px;
              background: #ffffff;
            "
          >
            <tr>
              <td style="padding: 32px">
                <img
                  src="https://a-klassenhoiz.de/icons/icon-192.png"
                  alt="A-KlassenHoiz"
                  width="64"
                  height="64"
                  style="display: block; width: 64px; height: 64px; border: 0; border-radius: 16px"
                />
                <p
                  style="
                    margin: 16px 0 0;
                    font:
                      700 16px/1.4 Arial,
                      Helvetica,
                      sans-serif;
                    color: #00733f;
                  "
                >
                  A-KlassenHoiz
                </p>
                <h1
                  style="
                    margin: 24px 0 12px;
                    font:
                      700 28px/1.2 Arial,
                      Helvetica,
                      sans-serif;
                    color: #13261c;
                  "
                >
                  Passwort zurücksetzen
                </h1>
                <p
                  style="
                    margin: 0;
                    font:
                      400 16px/1.6 Arial,
                      Helvetica,
                      sans-serif;
                  "
                >
                  Für dein A-KlassenHoiz-Konto wurde ein neues Passwort angefordert.
                </p>
                <p style="margin: 28px 0">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      border-radius: 12px;
                      background: #00733f;
                      padding: 14px 22px;
                      font:
                        700 16px/1.2 Arial,
                        Helvetica,
                        sans-serif;
                      color: #ffffff;
                      text-decoration: none;
                    "
                    >Neues Passwort festlegen</a
                  >
                </p>
                <p
                  style="
                    margin: 0;
                    font:
                      400 13px/1.5 Arial,
                      Helvetica,
                      sans-serif;
                    color: #52665a;
                  "
                >
                  Falls du das nicht angefordert hast, kannst du diese E-Mail ignorieren.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
